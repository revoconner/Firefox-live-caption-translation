<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Caption Translate settings</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <form id="form">
        <section>
            <h2>Behaviour</h2>
            <label class="row"><input type="checkbox" name="showNativeLive"> Show live transcription in the original language for non English speech <span class="hint">On: the italic line updates in the spoken language, and each finished sentence appears in that language until its English replaces it. Off: only the finished English translation is shown.</span></label>
            <label class="row"><input type="checkbox" name="englishLive"> Show live transcription for English speech <span class="hint">On: the line grows as the words are recognised, styled like a finished caption. Off: each sentence appears only once it is finished.</span></label>
            <label class="row">Delay before removing a caption <input type="number" name="removeDelayMs" min="0" max="60000" step="50"> ms <span class="hint">Counted from when the line is complete: after its translation, or after the final transcription when none is needed.</span></label>
        </section>
        <section>
            <h2>Appearance</h2>
            <label class="row">Font size <input type="number" name="fontSize" min="8" max="120" step="1"> px <span class="hint">At a 1280 px wide player. Scales up and down with the player size.</span></label>
            <label class="row">Font colour <input type="color" name="fontColor"></label>
            <label class="row">Outline colour <input type="color" name="outlineColor"> opacity <input type="range" name="outlineOpacity" min="0" max="100" step="1"> <output data-for="outlineOpacity"></output>%</label>
            <label class="row">Background colour <input type="color" name="bgColor"> opacity <input type="range" name="bgOpacity" min="0" max="100" step="1"> <output data-for="bgOpacity"></output>%</label>
        </section>
        <section>
            <h2>Preview</h2>
            <div id="preview"><div class="lct-line">This is what a finished caption looks like.</div><div class="lct-partial">and a live line in the original language</div></div>
        </section>
        <p class="actions"><button type="button" id="reset">Reset to defaults</button> <span id="saved" class="hint"></span></p>
    </form>
    <script src="settings.js"></script>
    <script src="options.js"></script>
</body>
</html>
